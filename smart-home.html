<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeskBuddy · Smart Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="sh-page">
    <header class="sh-header">
      <a class="back-btn" href="index.html" aria-label="Back to dashboard" data-icon="arrowLeft"></a>
      <div>
        <h1>Smart Home</h1>
        <div class="sub" id="sh-summary"></div>
      </div>
      <div class="spacer"></div>
      <div class="sh-clock" id="sh-clock"></div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="devices"><span data-icon="light" data-size="16"></span>Devices</button>
      <button class="tab" data-tab="servers"><span data-icon="server" data-size="16"></span>Servers <span class="count" id="srv-count"></span></button>
    </nav>

    <!-- Devices: smart light -->
    <div class="panel" id="panel-devices">
      <div class="notice" id="light-notice">
        <span data-icon="info" data-size="18"></span>
        <div><b>Preview only.</b> DeskBuddy can't reach your Alexa light yet, so these controls don't change the real light. Tell Claude your light's brand to connect it.</div>
      </div>

      <section class="light card" id="light">
        <div class="light-main">
          <div class="light-orb" id="light-orb" data-icon="light" data-size="40"></div>
          <div class="grow">
            <div class="light-name" id="light-name"></div>
            <div class="light-state" id="light-state"></div>
          </div>
          <button class="toggle big" id="light-toggle" aria-label="Turn light on or off"></button>
        </div>

        <div class="light-section">
          <div class="light-label"><span>Brightness</span><span id="light-bright-val"></span></div>
          <input type="range" min="1" max="100" id="light-bright" class="bright-slider" aria-label="Brightness">
        </div>

        <div class="light-section">
          <div class="light-label"><span>Colour</span><span id="light-color-name"></span></div>
          <div class="swatches" id="swatches"></div>
        </div>
      </section>

      <div class="section-title">Scenes</div>
      <div class="scenes" id="scenes"></div>
    </div>

    <!-- Servers + Tailscale -->
    <div class="panel" id="panel-servers" hidden>
      <div class="srv-summary">
        <div class="srv-stat card"><div class="stat-value good" id="srv-up">–</div><div class="stat-label">Running</div></div>
        <div class="srv-stat card"><div class="stat-value" id="srv-down">–</div><div class="stat-label">Stopped</div></div>
        <div class="srv-stat card"><div class="stat-value" id="srv-ms">–</div><div class="stat-label">Avg response</div></div>
        <div class="srv-stat card srv-checked">
          <div><div class="stat-value" id="srv-checked">–</div><div class="stat-label">Last checked</div></div>
          <button class="open-btn" id="srv-refresh">Check now</button>
        </div>
      </div>

      <h2 class="section-head">Servers</h2>
      <section class="servers" id="servers"></section>

      <div class="section-head-row">
        <h2 class="section-head">Tailscale</h2>
        <span class="muted" id="ts-meta"></span>
      </div>
      <section class="ts card" id="tailscale">
        <p class="ts-empty">Loading Tailscale…</p>
      </section>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/clock.js"></script>
  <script src="assets/devices.js"></script>
  <script src="assets/servers.js"></script>
  <script src="assets/tailscale.js"></script>
  <script src="assets/smart-home.js"></script>
</body>
</html>
