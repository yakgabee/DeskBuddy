<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeskBuddy · Smart Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="sh-page">
    <header class="sh-header">
      <a class="back-btn" href="index.html" aria-label="Back to dashboard" data-icon="arrowLeft"></a>
      <div>
        <h1>Smart Home</h1>
        <div class="sub" id="sh-summary"></div>
      </div>
      <div class="spacer"></div>
      <div class="sh-clock" id="sh-clock"></div>
    </header>

    <!-- Servers + Tailscale -->
    <div id="panel-servers">
      <div class="srv-summary">
        <div class="srv-stat card"><div class="stat-value good" id="srv-up">–</div><div class="stat-label">Running</div></div>
        <div class="srv-stat card"><div class="stat-value" id="srv-down">–</div><div class="stat-label">Stopped</div></div>
        <div class="srv-stat card"><div class="stat-value" id="srv-ms">–</div><div class="stat-label">Avg response</div></div>
        <div class="srv-stat card srv-checked">
          <div><div class="stat-value" id="srv-checked">–</div><div class="stat-label">Last checked</div></div>
          <button class="open-btn" id="srv-refresh">Check now</button>
        </div>
      </div>

      <h2 class="section-head">Servers</h2>
      <section class="servers" id="servers"></section>

      <div class="section-head-row">
        <h2 class="section-head">Tailscale</h2>
        <span class="muted" id="ts-meta"></span>
      </div>
      <section class="ts card" id="tailscale">
        <p class="ts-empty">Loading Tailscale…</p>
      </section>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/clock.js"></script>
  <script src="assets/servers.js"></script>
  <script src="assets/tailscale.js"></script>
  <script src="assets/smart-home.js"></script>
</body>
</html>
