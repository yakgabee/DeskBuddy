<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeskBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/errors.js"></script>
  <script src="assets/kiosk.js"></script>
</head>
<body class="home">
  <main class="dashboard">
    <!-- Time & date -->
    <section class="clock card">
      <div class="clock-main">
        <div class="greeting" id="greeting">Good evening</div>
        <div class="clock-time" id="time">--:--<span class="ampm"></span></div>
        <div class="clock-date" id="date"></div>
      </div>
      <div class="weather" id="weather" hidden>
        <div class="wx-now"><span class="wx-icon" id="wx-icon"></span><span class="wx-temp" id="wx-temp"></span></div>
        <div class="wx-cond" id="wx-cond"></div>
        <div class="wx-range" id="wx-range"></div>
      </div>
    </section>

    <!-- Smart Home widget -->
    <a class="smart-home-tile card" href="smart-home.html" aria-label="Open Smart Home">
      <div class="tile-head">
        <div class="tile-title"><span class="tile-icon" data-icon="home"></span>Smart Home</div>
        <span class="tile-arrow" data-icon="chevronRight"></span>
      </div>
      <div class="tile-stats">
        <div><div class="stat-value" id="stat-devices">–</div><div class="stat-label">Devices online</div></div>
        <div><div class="stat-value" id="stat-servers">–</div><div class="stat-label">Servers up</div></div>
        <div><div class="stat-value" id="stat-ts">–</div><div class="stat-label">Tailscale online</div></div>
      </div>
    </a>

    <!-- uTorrent: only shown while something is downloading -->
    <a class="downloads card" id="downloads" href="smart-home.html#downloads" hidden>
      <div class="dl-head">
        <span class="dl-title"><span data-icon="download" data-size="18"></span><span id="dl-title">Downloading</span></span>
        <span class="muted" id="dl-speed"></span>
      </div>
      <div class="dl-list" id="dl-list"></div>
    </a>

    <!-- Spotify now playing -->
    <section class="now-playing card is-empty" id="now-playing">
      <div class="cover-wrap">
        <button class="cover" id="cover" aria-label="Show lyrics">
          <img id="cover-img" alt="" hidden>
          <span class="cover-icon" data-icon="lyrics" data-size="56"></span>
          <span class="cover-album" id="cover-album"></span>
          <span class="cover-artist" id="cover-artist"></span>
          <span class="cover-hint"><span data-icon="lyrics" data-size="14"></span>Lyrics</span>
        </button>
      </div>
      <div class="np-info">
        <div class="np-label">
          <span class="dot"></span><span id="np-source">Spotify</span>
          <button class="link-btn" id="btn-disconnect" hidden>Disconnect</button>
        </div>
        <div class="np-title" id="np-title">Spotify</div>
        <div class="np-artist" id="np-artist"></div>
        <div class="np-album" id="np-album"></div>
        <p class="np-message" id="np-message" hidden></p>
        <button class="connect-btn" id="btn-connect" hidden>Connect Spotify</button>
        <div class="player-ui">
          <div class="progress">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="progress-times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
          </div>
          <div class="controls">
            <button class="ctrl" id="btn-prev" aria-label="Previous" data-icon="prev"></button>
            <button class="ctrl play" id="btn-play" aria-label="Play/Pause"></button>
            <button class="ctrl" id="btn-next" aria-label="Next" data-icon="next"></button>
            <button class="lyrics-btn" id="btn-lyrics"><span data-icon="lyrics" data-size="16"></span>Lyrics</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Lyrics overlay -->
  <div class="lyrics" id="lyrics" role="dialog" aria-label="Lyrics">
    <div class="lyrics-head">
      <div class="mini-cover" id="lyrics-cover"></div>
      <div class="meta"><b id="lyrics-title"></b><span class="muted" id="lyrics-artist"></span></div>
      <button class="close-btn" id="lyrics-close" aria-label="Close lyrics" data-icon="x"></button>
    </div>
    <div class="lyrics-body" id="lyrics-body"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/config.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/clock.js"></script>
  <script src="assets/servers.js"></script>
  <script src="assets/tailscale.js"></script>
  <script src="assets/torrents.js"></script>
  <script src="assets/devices.js"></script>
  <script src="assets/appletv.js"></script>
  <script src="assets/weather.js"></script>
  <script src="assets/spotify-mock.js"></script>
  <script src="assets/spotify.js"></script>
  <script src="assets/lyrics.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
